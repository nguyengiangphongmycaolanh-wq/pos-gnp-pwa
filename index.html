<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS GNP</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POS GNP">
  <style>
    html, body { margin:0; padding:0; height:100%; background:#121212; overflow:hidden; }
    #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; background:#121212; z-index:10; transition:opacity .3s ease; }
    /* ✅ QUAN TRỌNG: khi ẩn phải cho chạm xuyên qua */
    #splash.an { opacity:0; pointer-events:none; }
    .loader { border:4px solid #333; border-top:4px solid #1a73e8; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
    #install-banner { position:fixed; left:12px; right:12px; bottom:12px; background:#1a73e8; color:#fff; padding:12px; border-radius:10px; display:none; align-items:center; justify-content:space-between; z-index:20; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="loader"></div>
    <p style="margin-top:16px;">Đang mở POS GNP...</p>
  </div>

  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbzQR6a-W3CfVJ2F94_G1i-XmChqbAxtS3lbgWWSfXm5J5vy0bTVQRHdJDTu6zauR9Y6wA/exec"
          allow="clipboard-read; clipboard-write; geolocation; camera; microphone"
          title="POS GNP"></iframe>

  <div id="install-banner">
    <span>Cài POS GNP lên máy?</span>
    <button id="install-btn" style="background:white;color:#1a73e8;border:none;padding:6px 12px;border-radius:6px;">Cài đặt</button>
  </div>

  <script>
    var splash = document.getElementById('splash');
    var frame  = document.getElementById('app-frame');

    // ✅ Ẩn splash ĐÚNG CÁCH: trong suốt + cho chạm xuyên + gỡ khỏi DOM
    function anSplash(){
      splash.classList.add('an');
      setTimeout(function(){ if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
    }
    frame.addEventListener('load', function(){ setTimeout(anSplash, 600); });
    setTimeout(anSplash, 6000); // phòng iframe load chậm

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }

    var deferredPrompt;
    var banner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'flex';
    });
    document.getElementById('install-btn').addEventListener('click', async function(){
      banner.style.display = 'none';
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });
  </script>
</body>
</html>
