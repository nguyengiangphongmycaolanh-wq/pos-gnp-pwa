<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POS GNP</title>
  
  <!-- ✅ PWA META TAGS (đúng thứ tự) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POS GNP">
  <meta name="theme-color" content="#1a73e8">
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
  
  <style>
    html,body{margin:0;padding:0;height:100%;background:#121212;overflow:hidden}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#121212;z-index:10;transition:opacity .3s ease;cursor:pointer}
    #splash.an{opacity:0;pointer-events:none}
    .loader{border:4px solid #333;border-top:4px solid #1a73e8;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #splashTip{margin-top:18px;font-size:12px;color:#8ab4f8;display:none;font-weight:700}
    #splashHint{margin-top:6px;font-size:11px;color:#9aa0a6}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
    #btnReload,#btnFull{position:fixed;left:26px;z-index:25;width:40px;height:40px;border-radius:50%;border:none;background:rgba(26,115,232,.9);color:#fff;font-size:16px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4)}
    #btnReload{bottom:calc(144px + env(safe-area-inset-bottom))}
    #btnFull{bottom:calc(192px + env(safe-area-inset-bottom))}
  </style>
</head>
<body>
  <div id="splash">
    <div class="loader"></div>
    <p style="margin-top:16px">Đang mở POS GNP...</p>
    <div id="splashTip">⏳ Mạng chậm? CHẠM VÀO ĐÂY ĐỂ VÀO THẲNG</div>
    <div id="splashHint">Chạm bất kỳ đâu để vào toàn màn hình ngay</div>
  </div>

  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbzQR6a-W3CfVJ2F94_G1i-XmChqbAxtS3lbgWWSfXm5J5vy0bTVQRHdJDTu6zauR9Y6wA/exec"
          allow="clipboard-read; clipboard-write; geolocation; camera; microphone; fullscreen"
          title="POS GNP"></iframe>

  <button id="btnReload" title="Tải lại POS">🔄</button>
  <button id="btnFull" title="Toàn màn hình">⛶</button>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzQR6a-W3CfVJ2F94_G1i-XmChqbAxtS3lbgWWSfXm5J5vy0bTVQRHdJDTu6zauR9Y6wA/exec';
    var splash = document.getElementById('splash');
    var tip    = document.getElementById('splashTip');
    var frame  = document.getElementById('app-frame');
    var daAn   = false;

    function tryFullscreen(){
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) { try { req.call(el); } catch(e) {} }
    }

    function anSplash(fromUserTap){
      if (daAn) return; daAn = true;
      if (fromUserTap) tryFullscreen();
      splash.classList.add('an');
      setTimeout(function(){ if (splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
      document.getElementById('btnReload').style.display = 'flex';
      document.getElementById('btnFull').style.display = 'flex';
    }

    frame.addEventListener('load', function(){ setTimeout(function(){ anSplash(false); }, 500); });
    splash.addEventListener('click', function(){ anSplash(true); });
    setTimeout(function(){ if (!daAn) tip.style.display = 'block'; }, 5000);
    setTimeout(function(){ anSplash(false); }, 9000);

    document.getElementById('btnReload').addEventListener('click', function(){
      daAn = false;
      splash.classList.remove('an');
      document.body.appendChild(splash);
      tip.style.display = 'none';
      frame.src = GAS_URL;
    });

    document.getElementById('btnFull').addEventListener('click', function(){
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        tryFullscreen();
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');

    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
    });
  </script>
</body>
</html>
